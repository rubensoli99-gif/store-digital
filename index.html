<!DOCTYPE html>

<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta 
            name="viewport" 
            content="width=device-width, 
            initial-scale=1.0" />
        <title>Digital Store - Cadastro</title>
        <link 
            rel="stylesheet" 
            href="style.css"
        />
    </head>
    <body>
        <header>
            <a href="#">
                <img 
                    src="./assets/logo.svg" 
                    alt="logo rosa da loja Digital store"
                 />
                <span>
                    Digital store
                </span> 
                
                
            </a>
        </header>
        <main>
            <form >
                <div class="title">
                    <h1>Acesse sua conta</h1>
                    <p>Novo cliente? Então registre-se <a href="#">aqui</a> .</p>

                </div>
                <div class="input">
                    <div >
                        <label>Email *</label>
                        <input 
                            type="email" 
                            placeholder="insira seu email "
                    />
                    </div>
                    <div>
                        <label>Senha *</label>
                        <input 
                            type="password"
                            placeholder="insira sua senha "
                     />
                    </div>
                </div>
                <p>
                     <a href="#">Esqueci minha senha</a>
                </p>
                <button>Acessar conta</button>
                <div class="others">
                    <p>
                        Ou faça login com
                    </p>
                    <ul>
                        <li>
                            <a href="#">
                                <img 
                                    src="./assets/email.svg" 
                                    alt="ícone para acesso com gmail "
                                />
                            </a>
                        </li>
                        <li>
                            <a href="#">
                                <img 
                                    src="./assets/facebook.svg"
                                    alt="ícone para acesso com facebook"
                                />
                            </a>
                        </li>
                    </ul>
                </div>
            </form>
        </main>
</body>
</html>
